# Claim binding (2026-10-01; capture-pipeline fix, see daily-capture-reports/_routines/ARCHITECTURE.md):
#   claims:        every factual claim in the title and body, bound to the verbatim span it came from:
#                  {id, type, value, qualifier, span, url, read, source_kind, outcome, checked}
#                  outcome = verified | span-missing | value-mismatch | unreachable
#                  (computed by tcp-skills daily-capture/scripts/check_sourcing.py --claims)
#   verification:  source-verified | captured | disputed  (computed, never chosen)
#                  | legacy  (one-time label, 2026-10-19: an entry with no claims that nobody has
#                  re-checked; NOT verified, never a gate finding; tcp-skills timeline-qa re-checks it and
#                  the gate replaces the label with the computed value). An entry without this field is
#                  treated like `legacy`. `status: confirmed` is written for new capture promotions only
#                  when source-verified; otherwise `reported`. Existing statuses are not downgraded en masse.
#                  The site shows source-verified as "Checked against sources", legacy/captured/none as
#                  "Not yet re-checked", and status or verification `disputed` as "Disputed".
#   event_date_claim: id of the claim whose span states the event date.
# Entries use `type: timeline_event`; this file's `event` type documents the shared field set.
types:
  event:
    description: "Historical event documenting institutional capture, corruption, or democratic erosion"
    subdirectory: ""
    file_pattern: "{date}--{slug}.md"
    required:
      - title
      - date
    optional:
      - importance
      - status
      - participants
      - sources
      - tags
      - verification
      - claims
      - event_date_claim
      - previous_ids
  # timeline_event: the type every entry here uses. The cascade pyrite extension declared it
  # until pyrite 0.26 removed that extension (#953); declared here since 2026-11-11 so a create
  # is not refused UNDECLARED_TYPE. Same field set as `event`, plus the extension's
  # actors/capture_lanes. List fields are typed so a create writes [] rather than "".
  # (tags and sources are reserved names and cannot be typed here.)
  timeline_event:
    description: "Timeline event documenting institutional capture, corruption, or democratic erosion"
    subdirectory: ""
    file_pattern: "{date}--{slug}.md"
    required:
      - title
      - date
    optional:
      - importance
      - status
      - actors
      - capture_lanes
      - participants
      - sources
      - tags
      - verification
      - claims
      - event_date_claim
      - previous_ids
    fields:
      date:
        type: date
      actors:
        type: list
        description: "People and organizations involved (names or [[wikilinks]])"
      capture_lanes:
        type: list
        description: "Capture lanes this event belongs to"
      participants:
        type: list
      claims:
        type: list
        description: "Claim bindings, see the header comment"
      previous_ids:
        type: list
