name: Deploy capturecascade.org

# Auto-deploys on any push to main that touches site-affecting paths, plus a
# manual trigger. The site is a Hugo build of the cascade-timeline content, so
# timeline edits, the Hugo layouts/scripts, and the deploy config all trigger a
# rebuild; unrelated repo changes (viewer/, docs, KB tooling) do not.
on:
  push:
    branches: [main]
    paths:
      - 'cascade-timeline/**'
      - 'hugo-timeline/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Only one deploy at a time. If a second push lands while one is running,
# the second waits; if a third lands, GitHub cancels the queued second one.
concurrency:
  group: deploy-capturecascade
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: SSH to VPS and run deploy.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CASCADE_DEPLOY_HOST }}
          username: ${{ secrets.CASCADE_DEPLOY_USER }}
          key: ${{ secrets.CASCADE_DEPLOY_SSH_KEY }}
          port: ${{ secrets.CASCADE_DEPLOY_PORT || 22 }}
          # The full build (content-gen + ~260s of OG-card PNGs + hugo render of
          # 5,500+ pages + sitemap validate) runs ~10-12 min inside a fresh
          # Docker build. appleboy/ssh-action defaults to a 10m command_timeout,
          # which was clipping the build mid-render — raise it well clear.
          # (The job-level timeout-minutes: 45 is the outer bound.)
          command_timeout: 40m
          # Fail loudly on any error inside the SSH session.
          # --no-interactive skips the prune prompt; CI never prunes,
          # since `docker system prune -af --volumes` would wipe ALL
          # unused volumes on the shared host (pyrite, demo, etc.).
          script: |
            set -euo pipefail
            cd ~/cascade-kb
            # Pull FIRST, here — not inside deploy.sh. bash reads the whole
            # script into memory before executing, so if deploy.sh pulled itself
            # it would run the PRE-pull version of its own logic (a fix to
            # deploy.sh would never take effect on the run that pulls it). By
            # pulling before invoking, the deploy.sh we run is always current.
            git fetch origin main --quiet
            git reset --hard origin/main
            bash deploy/deploy.sh --no-interactive
          # Stream output line-by-line so failures show in Actions log.
          script_stop: true

      # Assert the LIVE site is actually serving the commit we just pushed.
      #
      # This is the check that was missing on 2026-08-11, when the VPS lost its
      # git credential. `git fetch` failed on the host before deploy.sh ever
      # ran, so three consecutive deploys "failed" in ~10s — but from outside,
      # a 16-day-stale site looked identical to a fresh one, and nobody noticed
      # until a sitemap question surfaced it 16 days later.
      #
      # A workflow that goes red is only useful if someone looks. This step
      # makes the failure unambiguous and attributable: it fetches /build.json
      # (written by generate_content.py at build time) and compares its commit
      # to GITHUB_SHA. A deploy that silently no-ops now fails here loudly
      # instead of passing quietly.
      - name: Verify live site serves this commit
        run: |
          set -euo pipefail
          echo "expecting commit: $GITHUB_SHA"
          live_json="$(curl -sS --max-time 30 --retry 3 --retry-delay 10 \
            https://capturecascade.org/build.json || echo '{}')"
          echo "live build.json: $live_json"
          live_commit="$(printf '%s' "$live_json" | sed -n 's/.*"commit":"\([a-f0-9]*\)".*/\1/p')"
          if [ -z "$live_commit" ]; then
            echo "::error title=No build stamp::https://capturecascade.org/build.json did not return a commit. Either the deploy did not land or the build stamp is missing."
            exit 1
          fi
          if [ "$live_commit" != "$GITHUB_SHA" ]; then
            echo "::error title=Live site is stale::capturecascade.org is serving $live_commit but this run pushed $GITHUB_SHA. The deploy reported success without updating the site."
            {
              echo "## ⚠️ Live site is NOT serving this commit"
              echo ""
              echo "| | commit |"
              echo "|---|---|"
              echo "| pushed | \`$GITHUB_SHA\` |"
              echo "| live   | \`$live_commit\` |"
              echo ""
              echo "The deploy step reported success but the site did not update."
              echo "Check the VPS: \`ssh deploy@<host> 'cd ~/cascade-kb && git log -1 && git remote -v'\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✓ live site is serving $live_commit"
          echo "✓ capturecascade.org verified at \`$live_commit\`" >> "$GITHUB_STEP_SUMMARY"

      # Surface a failed deploy on the run summary so a broken build is visible
      # rather than silent. deploy.sh already rolls back on the VPS (the live
      # site keeps serving the previous container), so this is notification, not
      # remediation.
      - name: Report deploy failure
        if: failure()
        run: |
          echo "::error title=capturecascade.org deploy failed::deploy.sh exited non-zero. The VPS rolled back to the previous commit and the live site kept serving the prior container. See the SSH step log for the build error."
          {
            echo "## ❌ capturecascade.org deploy failed"
            echo ""
            echo "\`deploy.sh\` exited non-zero on the VPS. Per the rollback rail, the"
            echo "checkout was reverted to the previously-deployed commit and the site"
            echo "kept serving the prior container — **the live site was not taken down.**"
            echo ""
            echo "Fix the build error (see the SSH step log), push again, and the deploy re-runs."
          } >> "$GITHUB_STEP_SUMMARY"
